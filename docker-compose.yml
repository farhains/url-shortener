services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # 6380 on host to avoid colliding with iproxy-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  # ----- 3 stateless FastAPI backends -----
  # All run the same image, share the same Postgres + Redis, and differ
  # only by APP_ID. Statelessness is what lets nginx round-robin freely
  # across them.

  app1: &app
    build: ./app
    environment:
      DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      APP_ID: app-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    # NOTE: no `ports:` — backends are reachable only inside the Docker
    # network. nginx is the public entry point.

  app2:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      APP_ID: app-2

  app3:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      APP_ID: app-3

  # ----- nginx as L7 reverse proxy + round-robin LB -----
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"        # nginx is now the only thing exposed on host:8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    # Open-source nginx resolves upstream hostnames at startup. If any
    # one of them isn't in DNS yet (race with the apps registering),
    # nginx exits. on-failure restart lets it retry until everything
    # is reachable.
    restart: on-failure:5

volumes:
  pgdata:
