# nginx config for the URL shortener — L7 reverse proxy + round-robin load balancer.
# Sits in front of 3 FastAPI backends, all running the same code.

events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS server. 127.0.0.11 is the well-known
    # address for the resolver inside any user-defined Docker network.
    # `valid=10s` re-resolves every 10s so containers can come and go.
    # Without this, nginx refuses to start if any upstream hostname
    # can't be resolved at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream pool — 3 stateless FastAPI backends.
    # Round-robin is the default; max_fails + fail_timeout enable passive
    # health checking (open-source nginx doesn't ship active probes — those
    # are an nginx-plus / kubernetes-ingress feature).
    upstream backend {
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;
    }

    # Show the upstream that handled each request — useful for debugging
    # and for the /health-style demo where we want to see who answered.
    log_format upstream_log '$remote_addr - $upstream_addr - "$request" '
                            '$status $body_bytes_sent';
    access_log /var/log/nginx/access.log upstream_log;

    server {
        listen 80;
        server_name _;

        # Generic forwarding for every path/method.
        location / {
            proxy_pass http://backend;

            # Standard reverse-proxy headers so the backend knows what the
            # original client looked like (real client IP, original host).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Conservative timeouts.
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Surface the upstream that handled the request so curl can see it.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
